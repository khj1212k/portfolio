<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 276" width="720" height="276" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
<title id="t">뉴스레터 생성과 평가 흐름</title>
<desc id="d">뉴스레터를 생성한 뒤 핵심 사실 누락, 구조, 환각 기준으로 평가해 통과하면 저장하고, 미달이면 수정 의견을 쌓아 다시 생성하며, 생성은 최대 3번이고 3번째도 미달이면 저장하지 않는 흐름도</desc>
<rect x="0.5" y="0.5" width="719" height="275" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="40" font-size="17" font-weight="600" fill="#24292f" text-anchor="start">뉴스레터 생성과 평가 흐름</text>
<rect x="24" y="100" width="200" height="68" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="124" y="129.9" font-size="15" font-weight="600" fill="#24292f" text-anchor="middle">뉴스레터 생성</text>
<text x="124" y="148.9" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">최대 3번</text>
<rect x="270" y="100" width="220" height="68" rx="6" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
<text x="380" y="129.9" font-size="15" font-weight="600" fill="#24292f" text-anchor="middle">평가</text>
<text x="380" y="148.9" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">핵심 사실 누락, 구조, 환각</text>
<rect x="556" y="112" width="140" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="626" y="139.4" font-size="15" font-weight="600" fill="#24292f" text-anchor="middle">저장</text>
<rect x="556" y="182" width="140" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="626" y="209.4" font-size="15" font-weight="600" fill="#24292f" text-anchor="middle">저장하지 않음</text>
<path d="M224,134 L263,134" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="270,134 263,130 263,138" fill="#57606a"/>
<path d="M490,134 L549,134" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="556,134 549,130 549,138" fill="#57606a"/>
<text x="523" y="126" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">통과</text>
<path d="M380,100 L380,78 L124,78 L124,93" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="124,100 120,93 128,93" fill="#57606a"/>
<text x="252" y="70" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">미달이면 수정 의견을 쌓아 다시 생성</text>
<path d="M380,168 L380,204 L549,204" fill="none" stroke="#57606a" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="556,204 549,200 549,208" fill="#57606a"/>
<text x="468" y="196" font-size="13" font-weight="400" fill="#57606a" text-anchor="middle">3번째도 미달</text>
<text x="24" y="256" font-size="13" font-weight="400" fill="#57606a" text-anchor="start">팀 단계에서 설계한 생성 흐름, 팀 종료 커밋의 그래프 분기와 설정값</text>
</svg>
