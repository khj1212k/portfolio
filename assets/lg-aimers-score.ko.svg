<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" width="720" height="294" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
<title id="t">개인 탐색 트랙 제출 점수</title>
<desc id="d">개인 탐색 트랙 제출 점수 막대 그래프로, 로컬 검증 1위 조합을 제출했을 때 415점, 보정 신호 2종을 더하기 전 783.78점과 더한 뒤 983.26점을 보여 준다. 막대와 따로 적은 팀 결과는 1,030팀 중 17위, 34팀이 선발된 본선 진출</desc>
<rect x="0.5" y="0.5" width="719" height="293" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="40" font-size="17" font-weight="600" fill="#24292f" text-anchor="start">개인 탐색 트랙 제출 점수</text>
<text x="24" y="75" font-size="14" font-weight="600" fill="#24292f" text-anchor="start">로컬 검증 1위 조합을 제출했을 때</text>
<line x1="135.5" y1="82" x2="135.5" y2="114" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="103" font-size="14" font-weight="400" fill="#57606a" text-anchor="start">제출 점수</text>
<path d="M136,86 H332.03 A4,4 0 0 1 336.03,90 V106 A4,4 0 0 1 332.03,110 H136 Z" fill="#8c959f"/>
<text x="344.03" y="103.5" font-size="15" font-weight="600" fill="#24292f" text-anchor="start">415점</text>
<text x="24" y="143" font-size="14" font-weight="600" fill="#24292f" text-anchor="start">보정 신호 2종을 더한 결과</text>
<line x1="135.5" y1="150" x2="135.5" y2="216" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="171" font-size="14" font-weight="400" fill="#57606a" text-anchor="start">더하기 전</text>
<path d="M136,154 H509.78 A4,4 0 0 1 513.78,158 V174 A4,4 0 0 1 509.78,178 H136 Z" fill="#8c959f"/>
<text x="521.78" y="171.5" font-size="15" font-weight="600" fill="#24292f" text-anchor="start">783.78점</text>
<text x="24" y="205" font-size="14" font-weight="400" fill="#57606a" text-anchor="start">더한 뒤</text>
<path d="M136,188 H605.93 A4,4 0 0 1 609.93,192 V208 A4,4 0 0 1 605.93,212 H136 Z" fill="#0969da"/>
<text x="617.93" y="205.5" font-size="15" font-weight="600" fill="#24292f" text-anchor="start">983.26점</text>
<text x="24" y="242" font-size="13" font-weight="400" fill="#57606a" text-anchor="start">직접 제출해 받은 리더보드 점수, Brier Skill Score 기반</text>
<line x1="24" y1="254.5" x2="696" y2="254.5" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="274" font-size="13" font-weight="400" fill="#57606a" text-anchor="start">팀 결과: 1,030팀 중 17위, 34팀이 선발된 본선 진출</text>
</svg>
